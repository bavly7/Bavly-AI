<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bavly — AI Portfolio Assistant</title>
<style>
  :root {
    --bg: #0a0b0f;
    --panel: #12141a;
    --panel-glass: rgba(18, 20, 26, 0.7);
    --bubble-user: #1e3a8a;
    --bubble-bot: #1a1d28;
    --text: #e4e6eb;
    --muted: #8b92a8;
    --accent: #00d9ff;
    --accent-glow: rgba(0, 217, 255, 0.3);
    --purple: #b030ff;
    --purple-glow: rgba(176, 48, 255, 0.2);
    --border: #1f2332;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* Grid background effect */
  body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background:
      linear-gradient(90deg, rgba(0, 217, 255, 0.02) 1px, transparent 1px),
      linear-gradient(rgba(0, 217, 255, 0.02) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
    z-index: 0;
  }

  /* Header */
  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-glass);
    backdrop-filter: blur(10px);
    position: relative;
    z-index: 10;
  }

  header h1 {
    font-size: 20px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
  }

  header span {
    color: var(--muted);
    font-size: 13px;
  }

  /* Main Content Wrapper - Desktop: Chat Left, Character Right */
  #main-content {
    flex: 1;
    display: flex;
    gap: 0;
    overflow: hidden;
    position: relative;
    z-index: 1;
  }

  /* Chat Area */
  #chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Scrollbar styling */
  #chat::-webkit-scrollbar {
    width: 8px;
  }

  #chat::-webkit-scrollbar-track {
    background: transparent;
  }

  #chat::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 4px;
  }

  #chat::-webkit-scrollbar-thumb:hover {
    background: var(--accent);
  }

  .msg {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
    position: relative;
    animation: messageSlideIn 0.3s ease;
  }

  @keyframes messageSlideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--bubble-user), #1e40af);
    border-bottom-right-radius: 4px;
    box-shadow: 0 2px 8px rgba(30, 58, 138, 0.3);
  }

  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .msg.bot.pending {
    color: var(--muted);
    font-style: italic;
  }

  .links {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(0, 217, 255, 0.1);
    border: 1px solid rgba(0, 217, 255, 0.3);
    color: var(--accent);
    text-decoration: none;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 20px;
    transition: all 0.2s;
  }

  .chip:hover {
    background: rgba(0, 217, 255, 0.2);
    border-color: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
  }

  .sources {
    margin-top: 8px;
    font-size: 11px;
    color: var(--muted);
    opacity: 0.8;
  }

  .play-audio-btn {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 6px 12px;
    font-size: 12px;
    margin-top: 8px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .play-audio-btn:hover {
    background: rgba(0, 217, 255, 0.15);
    border-color: var(--accent);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0;
    font-size: 13px;
  }

  th, td {
    border: 1px solid var(--border);
    padding: 10px 12px;
    text-align: left;
  }

  th {
    background: rgba(0, 217, 255, 0.1);
    color: var(--accent);
    font-weight: 600;
  }

  /* Character Area - Right Side on Desktop */
  #character-area {
    width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 30px;
    position: relative;
    flex-shrink: 0;
    border-left: 1px solid var(--border);
  }

  /* Ambient glow effect */
  #character-area::before {
    content: '';
    position: absolute;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
    border-radius: 50%;
    filter: blur(80px);
    animation: float 8s ease-in-out infinite;
    opacity: 0.4;
    pointer-events: none;
  }

  @keyframes float {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(15px, -15px); }
  }

  /* Character container */
  .character-container {
    position: relative;
    width: 100%;
    max-width: 350px;
    height: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }

  /* Character glow ring */
  .character-glow {
    position: absolute;
    inset: -30px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.5s ease;
    filter: blur(50px);
    pointer-events: none;
  }

  .character-container.thinking .character-glow {
    opacity: 1;
    animation: pulse-glow 2s ease-in-out infinite;
  }

  .character-container.talking .character-glow {
    opacity: 0.8;
    animation: pulse-glow 0.8s ease-in-out infinite;
  }

  @keyframes pulse-glow {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }

  /* Character image */
  .character-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: absolute;
    opacity: 0;
    transition: opacity 0.4s ease;
    filter: drop-shadow(0 0 20px rgba(0, 217, 255, 0.2));
  }

  .character-img.active {
    opacity: 1;
  }

  .character-img.idle {
    animation: subtle-breath 4s ease-in-out infinite;
  }

  @keyframes subtle-breath {
    0%, 100% { transform: scale(1) translateY(0); }
    50% { transform: scale(1.01) translateY(-3px); }
  }

  /* Status indicator */
  .status-indicator {
    margin-top: 30px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    background: var(--panel-glass);
    border: 1px solid var(--border);
    border-radius: 24px;
    font-size: 13px;
    font-weight: 600;
    backdrop-filter: blur(10px);
    z-index: 1;
    letter-spacing: 0.5px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }

  .status-indicator.thinking .status-dot {
    animation: thinking-pulse 1.5s ease-in-out infinite;
  }

  .status-indicator.talking .status-dot {
    animation: talking-pulse 0.6s ease-in-out infinite;
  }

  @keyframes thinking-pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.6; }
  }

  @keyframes talking-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.5); }
  }

  /* Thinking particles */
  .particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .character-container.thinking .particles {
    opacity: 1;
  }

  .particle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--accent);
    animation: particle-float 3s ease-in-out infinite;
  }

  .particle:nth-child(1) { left: 20%; top: 20%; animation-delay: 0s; }
  .particle:nth-child(2) { left: 80%; top: 30%; animation-delay: 0.5s; }
  .particle:nth-child(3) { left: 40%; top: 70%; animation-delay: 1s; }
  .particle:nth-child(4) { left: 70%; top: 60%; animation-delay: 1.5s; }
  .particle:nth-child(5) { left: 50%; top: 40%; animation-delay: 2s; }

  @keyframes particle-float {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0; }
    50% { transform: translateY(-30px) scale(1.5); opacity: 1; }
  }

  /* Input area */
  form {
    display: flex;
    gap: 12px;
    padding: 20px 24px;
    border-top: 1px solid var(--border);
    background: var(--panel-glass);
    backdrop-filter: blur(10px);
    position: relative;
    z-index: 10;
  }

  .voice-controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #mic-btn {
    background: var(--panel);
    border: 2px solid var(--accent);
    color: var(--accent);
    width: 48px;
    height: 48px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  #mic-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  #mic-btn:hover::before {
    opacity: 0.15;
  }

  #mic-btn:hover {
    border-color: var(--accent);
    box-shadow: 0 0 20px var(--accent-glow);
  }

  #mic-btn.recording {
    background: rgba(239, 68, 68, 0.2);
    border-color: #ef4444;
    color: #ef4444;
    animation: recording-pulse 1.5s infinite;
  }

  @keyframes recording-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
    50% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
  }

  #recording-status {
    font-size: 12px;
    color: #ef4444;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #recording-status::before {
    content: '';
    width: 8px;
    height: 8px;
    background: #ef4444;
    border-radius: 50%;
    animation: blink 1s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  input[type="text"] {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14.5px;
    outline: none;
    transition: all 0.2s;
  }

  input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  button {
    background: linear-gradient(135deg, var(--accent), #00b8d9);
    color: #0a0b0f;
    border: none;
    padding: 0 24px;
    border-radius: 12px;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  button::before {
    content: '';
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    transition: opacity 0.2s;
  }

  button:hover::before {
    opacity: 0.2;
  }

  button:hover {
    box-shadow: 0 4px 12px var(--accent-glow);
    transform: translateY(-1px);
  }

  button:active {
    transform: translateY(0);
  }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  button:disabled:hover {
    box-shadow: none;
  }

  /* Responsive Design */
  @media (max-width: 1200px) {
    #character-area {
      width: 360px;
      padding: 30px 20px;
    }

    .character-container {
      max-width: 300px;
      height: 360px;
    }
  }

  @media (max-width: 1024px) {
    #character-area {
      width: 320px;
      padding: 24px 16px;
    }

    .character-container {
      max-width: 260px;
      height: 320px;
    }
  }

  @media (max-width: 768px) {
    /* Mobile: Character moves to top */
    #main-content {
      flex-direction: column;
    }

    #character-area {
      width: 100%;
      height: auto;
      border-left: none;
      border-bottom: 1px solid var(--border);
      padding: 24px 16px 20px;
      flex-shrink: 1;
    }

    .character-container {
      max-width: 200px;
      height: 240px;
    }

    .status-indicator {
      margin-top: 16px;
      font-size: 12px;
      padding: 8px 16px;
    }

    #character-area::before {
      width: 250px;
      height: 250px;
      filter: blur(60px);
    }

    #chat {
      padding: 16px;
      gap: 12px;
    }

    .msg {
      max-width: 85%;
      font-size: 14px;
    }

    form {
      padding: 16px;
      gap: 10px;
    }

    #mic-btn {
      width: 44px;
      height: 44px;
      font-size: 18px;
    }

    input[type="text"] {
      font-size: 14px;
      padding: 11px 14px;
    }

    button {
      padding: 0 20px;
      font-size: 13px;
    }
  }

  @media (max-width: 480px) {
    header {
      padding: 16px;
    }

    header h1 {
      font-size: 18px;
    }

    header span {
      font-size: 12px;
    }

    .character-container {
      max-width: 160px;
      height: 200px;
    }

    #chat {
      padding: 12px;
    }

    .msg {
      font-size: 13.5px;
    }
  }
</style>
</head>
<body>

<!-- Header -->
<header>
  <h1>Bavly AI</h1>
  <span>AI portfolio assistant — ask about projects, certifications, or experience</span>
</header>

<!-- Main Content: Chat + Character -->
<div id="main-content">
  <!-- Chat Area -->
  <div id="chat-area">
    <div id="chat"></div>
  </div>

  <!-- Character Area - Right Side on Desktop, Top on Mobile -->
  <div id="character-area">
    <div class="character-container" id="character-container">
      <div class="character-glow"></div>

      <!-- Character images (will use transparent versions) -->
      <img src="character/idle.png" alt="Bavly - Idle" class="character-img idle active" id="idle-img">
      <img src="character/thincking.png" alt="Bavly - Thinking" class="character-img" id="thinking-img">
      <img src="character/bavly_move.gif" alt="Bavly - Talking" class="character-img" id="talking-img">

      <!-- Thinking particles -->
      <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
      </div>
    </div>

    <!-- Status indicator moved close to character -->
    <div class="status-indicator" id="status-indicator">
      <div class="status-dot"></div>
      <span id="status-text">AI ONLINE</span>
    </div>
  </div>
</div>

<!-- Input Form -->
<form id="chat-form">
  <div class="voice-controls">
    <button id="mic-btn" type="button" title="Record voice message">🎤</button>
    <span id="recording-status" style="display: none;">Recording...</span>
  </div>
  <input id="chat-input" type="text" placeholder="Ask something… (Arabic or English)" autocomplete="off" />
  <button id="send-btn" type="submit">Send</button>
  <!-- DEBUG: Test TTS button -->
  <button id="test-tts-btn" type="button" style="background: #ef4444; padding: 0 16px;" title="Test TTS">🔊 Test</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const API_BASE = "http://localhost:8000";

// DOM Elements
const chatEl = document.getElementById("chat");
const formEl = document.getElementById("chat-form");
const inputEl = document.getElementById("chat-input");
const sendBtn = document.getElementById("send-btn");
const micBtn = document.getElementById("mic-btn");
const recordingStatus = document.getElementById("recording-status");

// Character elements
const characterContainer = document.getElementById("character-container");
const idleImg = document.getElementById("idle-img");
const thinkingImg = document.getElementById("thinking-img");
const talkingImg = document.getElementById("talking-img");
const statusIndicator = document.getElementById("status-indicator");
const statusText = document.getElementById("status-text");

// State
let mediaRecorder = null;
let audioChunks = [];
let currentLanguage = "en";
let currentAudio = null;
let characterState = "idle"; // idle | thinking | talking

// Session management
let sessionId = localStorage.getItem("bavly_session_id");
if (!sessionId) {
  sessionId = crypto.randomUUID();
  localStorage.setItem("bavly_session_id", sessionId);
}

// ============================================================================
// CHARACTER STATE MANAGEMENT
// ============================================================================

function setCharacterState(newState) {
  if (characterState === newState) return;

  characterState = newState;

  // Remove all active states
  idleImg.classList.remove("active");
  thinkingImg.classList.remove("active");
  talkingImg.classList.remove("active");

  characterContainer.classList.remove("thinking", "talking");
  statusIndicator.classList.remove("thinking", "talking");

  // Apply new state
  switch (newState) {
    case "idle":
      idleImg.classList.add("active");
      statusText.textContent = "AI ONLINE";
      break;

    case "thinking":
      thinkingImg.classList.add("active");
      characterContainer.classList.add("thinking");
      statusIndicator.classList.add("thinking");
      statusText.textContent = "THINKING...";
      break;

    case "talking":
      talkingImg.classList.add("active");
      characterContainer.classList.add("talking");
      statusIndicator.classList.add("talking");
      statusText.textContent = "SPEAKING...";
      break;
  }
}

// ============================================================================
// MESSAGE HANDLING
// ============================================================================

function addMessage(role, text, { links = [], sources = [], pending = false, language = "en" } = {}) {
  const wrap = document.createElement("div");
  wrap.className = `msg ${role}${pending ? " pending" : ""}`;
  wrap.innerHTML = marked.parse(text);

  // Set text direction based on language
  if (language === "ar" || /[؀-ۿ]/.test(text)) {
    wrap.style.direction = "rtl";
    wrap.style.textAlign = "right";
  } else {
    wrap.style.direction = "ltr";
    wrap.style.textAlign = "left";
  }

  if (links.length > 0) {
    const linksWrap = document.createElement("div");
    linksWrap.className = "links";
    links.forEach((l) => {
      const a = document.createElement("a");
      a.className = "chip";
      a.href = l.url;

      if (l.url.startsWith("http")) {
        a.target = "_blank";
        a.rel = "noopener noreferrer";
      }

      a.textContent = l.title || l.platform;
      linksWrap.appendChild(a);
    });
    wrap.appendChild(linksWrap);
  }

  if (sources.length > 0) {
    const src = document.createElement("div");
    src.className = "sources";
    src.textContent = "Sources: " + sources.join(", ");
    wrap.appendChild(src);
  }

  // Add play audio button for bot messages (Read aloud)
  if (role === "bot" && !pending) {
    const playBtn = document.createElement("button");
    playBtn.className = "play-audio-btn";
    playBtn.innerHTML = "🔊 Read aloud";
    playBtn.dataset.text = text;
    playBtn.dataset.language = language;
    playBtn.addEventListener("click", () => playAudio(text, language, playBtn));
    wrap.appendChild(playBtn);
  }

  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  return wrap;
}

async function loadHistory() {
  if (!sessionId) return;
  try {
    const res = await fetch(`${API_BASE}/sessions/${sessionId}/messages`);
    if (!res.ok) return;
    const messages = await res.json();
    messages.forEach((m) => addMessage(m.role === "user" ? "user" : "bot", m.content));
  } catch (e) {
    // No history available
  }
}

async function sendMessage(text, voiceMode = false) {
  addMessage("user", text);

  // Character: IDLE → THINKING
  setCharacterState("thinking");

  const pendingEl = addMessage("bot", "…", { pending: true });
  sendBtn.disabled = true;

  try {
    const res = await fetch(`${API_BASE}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session_id: sessionId, voice_mode: voiceMode }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `HTTP ${res.status}`);
    }

    const data = await res.json();

    pendingEl.remove();

    const links = [
      ...(data.certificate_links || []).map((c) => ({ title: c.title, url: c.url })),
      ...(data.profile_links || []).map((p) => ({ title: p.platform, url: p.url })),
    ];

    // Detect language from answer for TTS
    const hasArabic = /[؀-ۿ]/.test(data.answer);
    currentLanguage = hasArabic ? "ar" : "en";

    console.log("🌍 Detected language:", currentLanguage, "for text:", data.answer.substring(0, 50));

    const messageEl = addMessage("bot", data.answer, { links, sources: data.sources || [], language: currentLanguage });

    // Auto-play TTS if this was a voice input
    if (voiceMode) {
      const playButton = messageEl.querySelector('.play-audio-btn');
      if (playButton) {
        // Trigger auto-play immediately
        setTimeout(() => {
          playButton.click();
        }, 300);
      }
    } else {
      // Text input: THINKING → IDLE
      setCharacterState("idle");
    }
  } catch (e) {
    pendingEl.remove();
    addMessage("bot", "Something went wrong reaching the server. Please try again.");
    console.error(e);
    // Error: THINKING → IDLE
    setCharacterState("idle");
  } finally {
    sendBtn.disabled = false;
  }
}

// ============================================================================
// FORM SUBMISSION (TEXT INPUT)
// ============================================================================

formEl.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  sendMessage(text, false); // voiceMode = false for text
});

// ============================================================================
// VOICE RECORDING
// ============================================================================

micBtn.addEventListener("click", async () => {
  if (!mediaRecorder || mediaRecorder.state === "inactive") {
    // Start recording
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);

      mediaRecorder.ondataavailable = (e) => {
        audioChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
        audioChunks = [];

        // Stop all tracks to release microphone
        stream.getTracks().forEach(track => track.stop());

        // Send to STT
        await transcribeAndSend(audioBlob);
      };

      mediaRecorder.start();
      micBtn.classList.add("recording");
      micBtn.innerHTML = "⏹️";
      recordingStatus.style.display = "flex";
      sendBtn.disabled = true;
      inputEl.disabled = true;
    } catch (err) {
      console.error("Microphone access denied:", err);
      alert("Microphone access is required for voice input. Please allow microphone access in your browser settings.");
    }
  } else {
    // Stop recording
    mediaRecorder.stop();
    micBtn.classList.remove("recording");
    micBtn.innerHTML = "🎤";
    recordingStatus.style.display = "none";
    sendBtn.disabled = false;
    inputEl.disabled = false;
  }
});

async function transcribeAndSend(audioBlob) {
  // Character: IDLE → THINKING (for STT processing)
  setCharacterState("thinking");

  const pendingEl = addMessage("bot", "Transcribing...", { pending: true });

  try {
    const formData = new FormData();
    formData.append("audio", audioBlob, "recording.webm");

    const res = await fetch(`${API_BASE}/api/stt`, {
      method: "POST",
      body: formData,
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `STT failed: HTTP ${res.status}`);
    }

    const { text, language } = await res.json();

    pendingEl.remove();

    // Display transcribed text and send to chat WITH voice_mode=true
    currentLanguage = language;
    addMessage("user", text);
    sendMessage(text, true); // voiceMode=true for spoken input

  } catch (err) {
    pendingEl.remove();
    addMessage("bot", "Could not transcribe audio. Please try again or use text input.");
    console.error("STT error:", err);
    sendBtn.disabled = false;
    inputEl.disabled = false;
    // Error: THINKING → IDLE
    setCharacterState("idle");
  }
}

// ============================================================================
// AUDIO PLAYBACK (TTS)
// ============================================================================

async function playAudio(text, language, button) {
  console.log("🔊 playAudio called:");
  console.log("   Text (first 100 chars):", text.substring(0, 100));
  console.log("   Language:", language);
  console.log("   Has Arabic chars:", /[؀-ۿ]/.test(text));

  // If audio is already playing, stop it
  if (currentAudio && !currentAudio.paused) {
    console.log("⏹️ Stopping current audio");
    currentAudio.pause();
    currentAudio = null;
    button.innerHTML = "🔊 Read aloud";
    button.disabled = false;
    setCharacterState("idle");
    return;
  }

  const originalText = button.innerHTML;
  button.innerHTML = "⏳ Loading...";
  button.disabled = true;

  let audio = null;
  let audioUrl = null;

  try {
    console.log("📡 Fetching TTS from API...");
    const res = await fetch(`${API_BASE}/api/tts`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, language }),
    });

    console.log("📡 TTS Response status:", res.status);
    console.log("📡 TTS Response headers:", {
      contentType: res.headers.get("content-type"),
      contentLength: res.headers.get("content-length")
    });

    if (!res.ok) {
      const errorText = await res.text();
      console.error("❌ TTS API error:", errorText);
      throw new Error(`TTS failed: HTTP ${res.status}`);
    }

    const audioBlob = await res.blob();
    console.log("✅ Audio blob received:", {
      size: audioBlob.size,
      type: audioBlob.type
    });

    // Validate blob
    if (audioBlob.size === 0) {
      throw new Error("Received empty audio blob");
    }

    if (!audioBlob.type.startsWith("audio/")) {
      console.warn("⚠️ Unexpected MIME type:", audioBlob.type);
    }

    audioUrl = URL.createObjectURL(audioBlob);
    console.log("✅ Audio URL created");

    audio = new Audio(audioUrl);
    audio.volume = 1.0;
    audio.preload = "auto";

    console.log("🔊 Audio object created, volume:", audio.volume);

    // Set up event handlers BEFORE playing
    audio.onloadedmetadata = () => {
      console.log("✅ Audio metadata loaded - duration:", audio.duration, "seconds");
    };

    audio.oncanplaythrough = () => {
      console.log("✅ Audio can play through without buffering");
    };

    audio.onplaying = () => {
      console.log("✅ Audio is actually playing now");
    };

    audio.ontimeupdate = () => {
      if (audio.currentTime > 0 && audio.currentTime < 0.5) {
        console.log("✅ Audio playback confirmed at", audio.currentTime.toFixed(2), "seconds");
      }
    };

    audio.onended = () => {
      console.log("✅ Audio ended naturally");
      cleanup();
    };

    audio.onerror = (e) => {
      console.error("❌ Audio error event:", {
        error: audio.error,
        code: audio.error?.code,
        message: audio.error?.message
      });
      cleanup();
      alert("Audio playback error. Check console for details.");
    };

    // Cleanup function
    const cleanup = () => {
      if (audioUrl) {
        URL.revokeObjectURL(audioUrl);
      }
      button.innerHTML = originalText;
      button.onclick = () => playAudio(text, language, button);
      if (currentAudio === audio) {
        currentAudio = null;
      }
      setCharacterState("idle");
    };

    // Stop handler
    const stopHandler = () => {
      console.log("⏹️ Stop button clicked");
      if (audio) {
        audio.pause();
      }
      cleanup();
    };

    button.onclick = stopHandler;

    // Try to play audio - this is the critical point
    console.log("▶️ Attempting audio.play()...");

    try {
      const playPromise = audio.play();

      await playPromise;

      console.log("✅ audio.play() promise resolved - playback started");

      // Only set TALKING state after play() succeeds
      currentAudio = audio;
      button.innerHTML = "⏹️ Stop";
      button.disabled = false;
      setCharacterState("talking");
      console.log("🎭 Character state → TALKING");

    } catch (playError) {
      console.error("❌ audio.play() promise rejected:", {
        name: playError.name,
        message: playError.message
      });

      // Handle specific errors
      if (playError.name === "NotAllowedError") {
        console.error("❌ Browser blocked audio autoplay!");
        console.error("   This usually means user interaction is required first.");
        alert("Browser blocked audio playback. Please click 'Read aloud' button directly.");
      } else if (playError.name === "NotSupportedError") {
        console.error("❌ Audio format not supported by browser");
        alert("Audio format not supported. Check TTS backend output format.");
      } else {
        console.error("❌ Unknown playback error:", playError);
        alert(`Playback failed: ${playError.message}`);
      }

      cleanup();
      throw playError;
    }

  } catch (err) {
    console.error("❌ TTS error:", err);
    button.innerHTML = originalText;
    button.disabled = false;

    if (audioUrl) {
      URL.revokeObjectURL(audioUrl);
    }

    if (characterState === "talking") {
      setCharacterState("idle");
    }

    // Don't show alert if we already showed one
    if (!err.message.includes("blocked") && !err.message.includes("format")) {
      alert(`Could not play audio: ${err.message}`);
    }
  }
}
